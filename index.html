<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fighter Viewer</title>
  <link rel="stylesheet" href="src/common/css/index.css">

  <!-- importmap：讓 import 'three' 指向 CDN，不需打包工具 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="stage" class="index_stage"></main>

  <div id="loading" class="index_loading">
    <p class="index_loading-text">載入中…<span id="loadingProgress">0%</span></p>
  </div>

  <section id="frameMeter" class="index_frameMeter" aria-label="幀數表">
    <div class="index_frameMeter-row">
      <span class="_label">F</span>
      <div id="frameMeterRuler" class="index_frameMeter-ruler"></div>
    </div>
    <div class="index_frameMeter-row">
      <span class="_label">P1</span>
      <div id="frameMeterP1" class="index_frameMeter-cells"></div>
    </div>
    <div class="index_frameMeter-row">
      <span class="_label">P2</span>
      <div id="frameMeterP2" class="index_frameMeter-cells"></div>
    </div>
    <div class="index_frameMeter-foot">
      <p id="frameMeterInfo" class="_info">出招後開始記錄</p>
      <ul class="index_frameMeter-legend">
        <li class="_item is_startup">前搖</li>
        <li class="_item is_frozen">前搖（演出凍結中）</li>
        <li class="_item is_active">攻擊判定</li>
        <li class="_item is_recovery">收招 / 落地</li>
        <li class="_item is_stun">受擊硬直</li>
        <li class="_item is_block">防禦硬直</li>
        <li class="_item is_dash">衝刺</li>
        <li class="_item is_down">無敵</li>
        <li class="_item is_prejump">起跳</li>
        <li class="_item is_air">滯空</li>
      </ul>
    </div>
  </section>

  <p id="coordP1" class="index_coord"></p>
  <p id="coordP2" class="index_coord"></p>

  <!-- 連段數：P1 畫面左側、P2 畫面右側 -->
  <div id="comboP1" class="index_combo is_p1" aria-live="polite">
    <span class="_num">0</span>
    <span class="_text">HITS</span>
  </div>
  <div id="comboP2" class="index_combo is_p2" aria-live="polite">
    <span class="_num">0</span>
    <span class="_text">HITS</span>
  </div>

  <!-- P1 按鍵示意 + 操作說明：data-key = e.code，按下時亮起（main.js _updateKeycaps） -->
  <aside class="index_keys" aria-label="按鍵與操作說明">
    <div class="index_keys-board">
      <div class="index_keys-group">
        <div class="index_keys-move">
          <kbd class="index_key is_w" data-key="KeyW"><b>W</b><small>跳</small></kbd>
          <kbd class="index_key is_a" data-key="KeyA"><b>A</b><small>左</small></kbd>
          <kbd class="index_key is_s" data-key="KeyS"><b>S</b><small>下</small></kbd>
          <kbd class="index_key is_d" data-key="KeyD"><b>D</b><small>右</small></kbd>
          <kbd class="index_key is_space" data-key="Space"><b>Space</b><small>跳</small></kbd>
        </div>
      </div>
      <div class="index_keys-group">
        <div class="index_keys-pad">
          <kbd class="index_key is_light" data-key="Numpad7"><b>7</b><small>輕</small></kbd>
          <kbd class="index_key is_medium" data-key="Numpad8"><b>8</b><small>中</small></kbd>
          <kbd class="index_key is_heavy" data-key="Numpad9"><b>9</b><small>重</small></kbd>
          <kbd class="index_key is_super" data-key="Numpad4"><b>4</b><small>dodge_step</small></kbd>
          <kbd class="index_key is_super" data-key="Numpad5"><b>5</b><small>kick_ball</small></kbd>
          <kbd class="index_key is_super" data-key="Numpad6"><b>6</b><small>招式選取</small></kbd>
          <kbd class="index_key is_rush is_wide" data-key="Numpad0"><b>0</b><small>衝刺取消</small></kbd>
        </div>
      </div>
    </div>
    <ul class="index_keys-info">
      <li class="_item">後 = 防禦　S + 後 = 原地防禦　連按兩下 = 衝刺</li>
      <li class="_item">Shift + 數字鍵 = P2 出招</li>
      <li class="_item">P 暫停　Esc 重置　滑鼠轉動 / 縮放鏡頭</li>
    </ul>
  </aside>

  <script type="module" src="src/common/js/main.js"></script>
</body>
</html>
